<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ruta Vending</title><style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f2f5f7;color:#1b2933}main{max-width:650px;margin:auto;padding:14px}header{background:#17212b;color:white;padding:20px;border-radius:16px}h1{margin:0}.card{background:white;padding:16px;border-radius:14px;margin-top:12px}input,button{font:inherit;padding:11px;border-radius:9px}input{width:100%;border:1px solid #cbd5df;margin:5px 0 10px}button{border:0;background:#17212b;color:white;cursor:pointer;margin:3px}.green{background:#13865b}.item{border-bottom:1px solid #ddd;padding:12px 0}.small{color:#64748b;font-size:13px}.row{display:flex;align-items:center;gap:8px}.row input[type=checkbox]{width:23px;height:23px}#error{color:#b42318}.hidden{display:none}.route{border-left:3px solid #13865b;padding:9px;margin:8px 0}</style></head><body><main><header><h1>🚚 Ruta Vending</h1><div>Tu reparto, más organizado</div></header><p id="error" role="alert"></p><section id="login" class="card"><h2>Iniciar sesión</h2><input id="email" type="email" placeholder="Correo electrónico" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="green" id="signin">Entrar</button></section><div id="app" class="hidden"><section class="card"><button id="logout">Cerrar sesión</button><label class="small">Punto de salida</label><input id="base" placeholder="Ej. Mairena del Alcor, Sevilla"><button class="green" id="plan">Organizar ruta</button><button id="mapsall">Abrir ruta en Google Maps</button><button id="reset">Desmarcar selección</button></section><section class="card"><h2>Mis máquinas</h2><div id="places"></div><h3>Añadir máquina</h3><form id="add"><input name="nombre" placeholder="Nombre" required><input name="direccion" placeholder="Dirección completa" required><div class="row"><label>Apertura<input name="apertura" type="time" value="09:00" required></label><label>Cierre<input name="cierre" type="time" value="18:00" required></label></div><input name="notas" placeholder="Notas"><button class="green">Guardar máquina</button></form></section><section class="card"><h2>Ruta de hoy</h2><p class="small">Orden aproximado por apertura y localidad. No calcula distancias reales ni garantiza cumplir todos los cierres. Google Maps calcula el tráfico al navegar.</p><div id="route"></div><button class="green" id="next">Navegar a siguiente parada</button><button id="done">Marcar siguiente terminada</button></section></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://hltoomzggocllpjdvopq.supabase.co','sb_publishable_L8gF1Z80Z3QOZcZZYy73ww_7_HZN8Yu');
const $=x=>document.getElementById(x);let machines=[],visits=new Map(),selected=new Set(),order=[];const date=()=>new Date().toLocaleDateString('sv-SE');const err=e=>$('error').textContent=e?.message||String(e||'');const zone=s=>(s||'').split(',').at(-2)?.trim().toLowerCase()||(s||'').split(',').at(-1)?.trim().toLowerCase()||'';
async function request(q){const {data,error}=await q;if(error)throw error;return data}
async function refresh(){try{machines=await request(sb.from('maquinas').select('*').order('nombre'));let v=await request(sb.from('visitas').select('*').eq('fecha',date()));visits=new Map(v.map(x=>[x.maquina_id,x.realizada]));selected=new Set([...selected].filter(id=>machines.some(m=>m.id===id)));render()}catch(e){err(e)}}
function render(){let el=$('places');el.replaceChildren();machines.forEach(m=>{let div=document.createElement('div');div.className='item';let row=document.createElement('div');row.className='row';let ck=document.createElement('input');ck.type='checkbox';ck.checked=selected.has(m.id);ck.onchange=()=>{ck.checked?selected.add(m.id):selected.delete(m.id);plan()};let label=document.createElement('strong');label.textContent=m.nombre+(visits.get(m.id)?' ✅':'');row.append(ck,label);let detail=document.createElement('div');detail.className='small';detail.textContent=`${m.direccion} · ${m.hora_apertura?.slice(0,5)}–${m.hora_cierre?.slice(0,5)}`;let edit=document.createElement('button');edit.textContent='Editar';edit.onclick=async()=>{let nombre=prompt('Nombre',m.nombre);if(nombre===null)return;let direccion=prompt('Dirección',m.direccion);if(direccion===null)return;let apertura=prompt('Apertura (HH:MM)',m.hora_apertura.slice(0,5));if(apertura===null)return;let cierre=prompt('Cierre (HH:MM)',m.hora_cierre.slice(0,5));if(cierre===null)return;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(apertura)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(cierre))return err('Horario incorrecto');try{await request(sb.from('maquinas').update({nombre,direccion,hora_apertura:apertura,hora_cierre:cierre}).eq('id',m.id));await refresh()}catch(e){err(e)}};let del=document.createElement('button');del.textContent='Eliminar';del.onclick=async()=>{if(!confirm('¿Eliminar esta máquina?'))return;try{await request(sb.from('maquinas').delete().eq('id',m.id));selected.delete(m.id);await refresh()}catch(e){err(e)}};div.append(row,detail,edit,del);el.append(div)});plan()}
function plan(){order=machines.filter(m=>selected.has(m.id)&&!visits.get(m.id)).sort((a,b)=>a.hora_apertura.localeCompare(b.hora_apertura)||zone(a.direccion).localeCompare(zone(b.direccion)));$('route').replaceChildren();order.forEach((m,i)=>{let d=document.createElement('div');d.className='route';d.textContent=`${i+1}. ${m.nombre} — ${m.direccion} (${m.hora_apertura.slice(0,5)}–${m.hora_cierre.slice(0,5)})`;$('route').append(d)})}
function navigate(){if(!order.length)return err('Selecciona máquinas pendientes');window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(order[0].direccion)+'&travelmode=driving','_blank')}
$('signin').onclick=async()=>{try{err('');await request(sb.auth.signInWithPassword({email:$('email').value,password:$('password').value}));await session()}catch(e){err(e)}};
$('logout').onclick=async()=>{await sb.auth.signOut();await session()};
async function session(){let {data:{user}}=await sb.auth.getUser();$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user)await refresh();else{machines=[];selected.clear();order=[]}}
$('add').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let {data:{user}}=await sb.auth.getUser();await request(sb.from('maquinas').insert({user_id:user.id,nombre:f.get('nombre'),direccion:f.get('direccion'),hora_apertura:f.get('apertura'),hora_cierre:f.get('cierre'),notas:f.get('notas'),activa:true}));e.target.reset();await refresh()}catch(e){err(e)}};
$('plan').onclick=plan;$('next').onclick=navigate;$('done').onclick=async()=>{if(!order.length)return;try{let {data:{user}}=await sb.auth.getUser();await request(sb.from('visitas').upsert({user_id:user.id,maquina_id:order[0].id,fecha:date(),realizada:true},{onConflict:'maquina_id,fecha'}));visits.set(order[0].id,true);render()}catch(e){err(e)}};
$('reset').onclick=()=>{selected.clear();render()};$('mapsall').onclick=()=>{if(!order.length)return err('Selecciona máquinas');let stops=order.slice(0,4);let u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent($('base').value||stops[0].direccion)+'&destination='+encodeURIComponent(stops.at(-1).direccion)+'&travelmode=driving';if(stops.length>1)u+='&waypoints='+stops.slice(0,-1).map(x=>encodeURIComponent(x.direccion)).join('%7C');window.open(u,'_blank');if(order.length>4)err('Google Maps móvil puede limitar paradas; usa navegación parada a parada.')};$('base').value=localStorage.getItem('rv_base')||'';$('base').onchange=()=>localStorage.setItem('rv_base',$('base').value);sb.auth.onAuthStateChange(()=>{});session();
</script></body></html>
